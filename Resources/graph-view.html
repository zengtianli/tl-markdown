<body>
<div class="app">
 <header class="top">
  <div class="brand"><div class="brand-mark" data-icon="layers"></div><span class="brand-name">Folio</span><span class="brand-caption">沿着关系，探索知识</span></div>
  <div class="top-actions"><nav class="view-tabs" aria-label="视图"><button id="knowledge-mode" class="active">关系</button><button id="directory-mode">目录</button><button id="advice-mode">整理</button></nav><button class="sample" id="live-status" title="查看索引状态">连接中…</button><div class="search"><span class="search-icon" data-icon="search"></span><input id="search" aria-label="搜索主题、问题或方法" placeholder="搜索主题、问题或方法…" autocomplete="off"><kbd>/</kbd><div id="results" class="results" role="region" aria-label="主题搜索结果"></div></div></div>
 </header>
 <main class="workspace">
  <section class="map" aria-label="知识与项目关系图">
   <div class="map-heading"><div><nav class="trail" id="trail" aria-label="探索足迹"></nav><h2 class="map-title" id="map-title">目录中的知识，一图可见</h2><p class="map-subtitle" id="map-subtitle">从本目录出发，查看文档、主题与来源。</p></div><div class="history-controls"><button class="home-control" id="back" aria-label="后退">←</button><button class="home-control" id="forward" aria-label="前进">→</button><button class="home-control" id="parent" aria-label="返回上一级">↑</button><button class="home-control" id="home"><span data-icon="compass"></span>回到全景</button></div></div>
   <button class="mobile-detail" id="mobile-detail" aria-expanded="false">主题详情 <span>↗</span></button>
   <div class="stage" id="stage" tabindex="0"><div class="areas" id="areas" aria-hidden="true"></div><svg class="lines" id="lines" aria-label="主题关系连线"></svg><div class="nodes" id="nodes" aria-label="可探索的知识主题"></div></div>
   <div class="map-bottom"><div><div class="legend" id="legend"></div><div class="guide" id="guide"></div></div><div class="zoom-box" aria-label="缩放控制"><button id="options" aria-label="索引与显示设置">⚙</button><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value" aria-label="当前缩放">100%</output><button id="zoom-in" aria-label="放大">+</button><button class="fit" id="fit" aria-label="适应画布"><span data-icon="fit"></span></button></div></div>
   <div class="map-footnote" id="map-footnote">点击深入 · 滚轮缩放 · 拖动回弹 · Alt+↑ 返回</div><div class="toast" id="toast" role="status"></div>
  </section>
  <aside class="detail" id="detail" aria-label="当前主题及全部直接关系"><div class="detail-scroll"><div class="eyebrow" id="eyebrow"></div><h1 id="detail-title"></h1><p class="description" id="description"></p><div class="tags" id="tags"></div><div class="detail-divider"></div><div class="section-title"><h2 id="relations-title">从这里出发</h2><small id="relation-count"></small></div><div id="relations"></div><div id="detail-note"></div></div><div class="detail-bottom"><button class="evidence-btn" id="evidence"><span data-icon="source"></span><span id="evidence-label">查看本地依据</span><span>↗</span></button><p class="sample-note" id="scope-note">来自本机原登记 · 自动跟随索引更新</p><button class="evidence-btn" id="location">查看目录位置 ↗</button></div></aside>
