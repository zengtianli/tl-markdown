name: folio
name_en: Folio
name_zh: 文页
display_name: Folio · 文页
family: folio
form: ios
platforms: [iphone, ipad, vision]
lifecycle: frozen
bundle_id: cyou.tianli.TLMarkdown.mobile
origin: own
sop:
  test: bash scripts/test-core.sh
  source_root: ../..
  # Shared family sources are first-class monitored inputs. Chapter must bind
  # these references in both original and staged receipts before reusing cache.
  source:
  - ios/01-源程序/Sources/**
  - ios/01-源程序/Shared/**
  - ios/01-源程序/Resources/**
  - ios/01-源程序/Fixtures/**
  - ios/01-源程序/project.yml
  - ios/01-源程序/scripts/**
  - Sources/Models.swift
  - Sources/IndexEngine.swift
  - Resources/Editor/**
  - Resources/THIRD-PARTY-NOTICES.txt
  - AppIcon.icns
  - icon/provenance.json
  - Info.plist
  test_inputs: [ios/01-源程序/Tests/**, ios/01-源程序/CLI/**, ios/01-源程序/scripts/**]
  ui: [ios/01-源程序/Sources/**, ios/01-源程序/Shared/**, ios/01-源程序/Resources/**, Resources/Editor/**]
  cli:
    commands: [folio]
    app: cyou.tianli.TLMarkdown
  # 手机、平板与 Vision 上能看、能点的 → Mac 上同一个 folio 命令（写法见 app 技能 references/agent-cli.md）。
  # 从 Sources/ContentView.swift、MobileStore.swift、DocumentWorkspace.swift 与 Shared/AppLifecycleMobile.swift 逐项列出；
  # 两端共用族根的 DocumentIO / SessionDisk，命令作用于 Mac 上的文件与会话记录。
  # 手机上的会话（打开了哪些文稿、未保存的修改、恢复草稿）存在手机 App 沙盒 Application Support/FolioMobile，
  # 移动版没有往 Mac 或后端发数据的通道；Mac 上 folio session、folio tabs 读写的是 Mac 窗口自己的会话，
  # 所以只落在手机会话里的几项记 device。文稿文件本身在“文件”里，放在 iCloud 云盘时 Mac 上是同一个文件。
  agent_cli:
    readback: folio status
    features:
    - name: 打开 Markdown（文件选择器、从其他 App 打开）
      command: folio open
    - name: 新建文稿
      device: 新建的未命名文稿只存在这台手机的会话记录里（App 沙盒 Application Support/FolioMobile），另存为之前没有文件；移动版没有往 Mac 或后端发数据的通道，Mac 上 folio write 写的是 Mac 能看到的文件，够不到手机上这份未命名文稿
    - name: 编辑正文
      command: folio write
    - name: 保存原文件
      command: folio write
    - name: 另存为…
      command: folio write
    - name: 文稿与恢复草稿列表（标题、有本地恢复草稿、提示）
      device: 列的是这台手机上打开过的文稿与本地恢复草稿，会话记录存在手机 App 沙盒（Application Support/FolioMobile），移动版不上报；Mac 上 folio session 读的是 Mac 窗口自己的会话，不是这一份
    - name: 在列表里切换文稿
      human: 窗口导航
    - name: 阅读文稿 / 编辑文稿
      human: 窗口的显示方式
    - name: 显示 Markdown 源码
      human: 窗口的显示方式
    - name: 状态条（原文件已保存 / 修改已存为本地恢复草稿、字数）
      device: 显示的是手机会话里当前文稿的状态（有没有未保存的修改、字数）；未保存的修改只存成手机 App 沙盒里的本地恢复草稿，移动版不上报。Mac 上 folio session 读的是 Mac 窗口自己的会话，不是这一份
    - name: 插入图片到文档旁的图片目录
      command: folio asset
    - name: 授权图片目录…
      human: 系统“文件”授权面板，只能真人在手机上点；Mac 端不需要这层授权
    - name: 重新载入并保留当前草稿
      device: 改的是手机上的会话：当前文稿改用磁盘上的文件，未保存的修改另存成手机 App 沙盒里的一份恢复草稿。Mac 上 folio tabs reload 操作的是 Mac 窗口的标签，够不到手机的会话
    - name: 点正文里的链接（跳到锚点、用系统打开网页与邮件链接、其他文稿给提示）
      human: 窗口里的手势
    - name: 提示条与关闭提示
      human: 只在窗口里有意义
    - name: 设置与更新（字号、阅读宽度、快捷键、iCloud、导入导出、版本）
      device: 手机本地配置与 App 包；原共享 AppConfiguration 只同步阅读偏好，不上报文稿、书签或恢复草稿；Mac CLI 不读手机沙盒，固定验收由真实模拟器 App 新进程读回
    - name: 检查更新
      device: 原共享 AppUpdateChecker 查询移动 App Store 记录 6819568883，安装由系统商店负责；Mac folio update 查的是另一条 Mac 发行渠道
    - name: 外接键盘重新载入（⌘⇧R，可关闭）
      device: 作用于手机当前文稿与本地恢复草稿，复用菜单同一安全重新载入动作；Mac CLI 不操作手机会话
  account:
    mode: none
    rationale: 本地文稿阅读与编辑入口，没有产品账号、注册或登录；文稿经系统“文件”授权读写，iCloud 云盘等位置由系统 Apple ID 管理，不作为本产品账号。
  accept:
    product_basics: /Users/tianli/Dev/.venv/bin/python -B scripts/accept/product_basics.py
    functionality: /Users/tianli/Dev/.venv/bin/python -B Tests/HostedHarness/run.py --chapter-accept --single-editor
    recovery: bash scripts/test-core.sh
    privacy: bash scripts/test-core.sh
    launch_iphone: SOP_FUNCTIONAL_THIN=1 bash scripts/launch.sh iphone
    launch_ipad: SOP_FUNCTIONAL_THIN=1 bash scripts/launch.sh ipad
    launch_vision: bash scripts/launch.sh vision
  product_basics:
    schema_version: 1
    features:
      settings:
        entry: 主界面与文稿菜单「设置与更新」，原生阅读偏好控件及共享导入导出
        readback: scripts/accept/product_basics.py --inspect；真实模拟器 App --product-basics-self-test 的 readback 阶段独立新进程读配置
      shortcuts:
        entry: 设置中的外接键盘开关；文稿菜单 ⌘⇧R 重新载入并保留草稿，不注册系统保留键
        readback: scripts/accept/product_basics.py --inspect；真实 App 动作、关闭恢复与新进程偏好读回
      icloud:
        entry: 设置「使用 iCloud 记住阅读配置」，默认关闭；原共享 KVS 同步与状态
        readback: scripts/accept/product_basics.py --inspect；真实 App 隔离共享同步往返、损坏恢复、离线回落及关闭保留
      updates:
        entry: 设置「检查更新」「前往 App Store」与启动自动检查开关；移动商店 6819568883
        readback: scripts/accept/product_basics.py --inspect；真实 App 更新状态、实际请求、错误恢复与新进程选项读回
    inputs:
    - scripts/accept/product_basics.py
    - Sources/MobileBasicsSelfTest.swift
    - Sources/MobileProductLifecycle.swift
    - Sources/MobileSettings.swift
    - Resources/Folio.entitlements
    - project.yml
  platforms:
    iphone:
      scheme: FolioMobile
      simulator: {device_type: iPhone-17-Pro}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/iphone/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 1500}
      distribution: testflight
    ipad:
      scheme: FolioMobile
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/ipad/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 1500}
      distribution: testflight
    vision:
      scheme: FolioMobile
      simulator: {device_type: Apple-Vision-Pro-4K}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 2000}
      distribution: none
    mac: {component: folio-mac}
    watch:
      not_applicable: 文稿的阅读、光标定位和正文编辑需要足够屏幕与输入；手表没有独立有用的文稿流程。
  measure:
    command: bash scripts/measure-platforms.sh --platform "${SOP_PERF_PLATFORM:-all}"
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/platforms]
    in_use: true
  budget:
    rationale: 系统 SwiftUI/WebKit 与现有按需加载 Editor；无服务器、轮询或驻留工作线程。数值为预算，尚无移动实测。
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/tl-markdown
    rationale: 同一 Folio 产品的移动文稿入口；公开政策继承原产品，移动构建尚未发行。
