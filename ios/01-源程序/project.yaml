name: folio
name_en: Folio
name_zh: 文页
display_name: Folio · 文页
family: folio
form: ios
platforms: [iphone, ipad, vision]
lifecycle: active
bundle_id: cyou.tianli.TLMarkdown.mobile
origin: own
sop:
  test: bash scripts/test-core.sh
  source_root: ../..
  # Shared family sources are first-class monitored inputs. Chapter must bind
  # these references in both original and staged receipts before reusing cache.
  source:
  - ios/01-源程序/Sources/**
  - ios/01-源程序/Shared/**
  - ios/01-源程序/Resources/**
  - ios/01-源程序/Fixtures/**
  - ios/01-源程序/project.yml
  - ios/01-源程序/scripts/**
  - Sources/Models.swift
  - Sources/IndexEngine.swift
  - Resources/Editor/**
  - Resources/THIRD-PARTY-NOTICES.txt
  - AppIcon.icns
  - icon/provenance.json
  - Info.plist
  test_inputs: [ios/01-源程序/Tests/**, ios/01-源程序/CLI/**, ios/01-源程序/scripts/**]
  ui: [ios/01-源程序/Sources/**, ios/01-源程序/Shared/**, ios/01-源程序/Resources/**, Resources/Editor/**]
  cli:
    commands: [folio]
    app: cyou.tianli.TLMarkdown
  # 手机、平板与 Vision 上能看、能点的 → Mac 上同一个 folio 命令（写法见 app 技能 references/agent-cli.md）。
  # 从 Sources/ContentView.swift、MobileStore.swift、DocumentWorkspace.swift 与 Shared/AppLifecycleMobile.swift 逐项列出；
  # 两端共用族根的 DocumentIO / SessionDisk，命令作用于 Mac 上的文件与会话记录。
  agent_cli:
    readback: folio status
    features:
    - name: 打开 Markdown（文件选择器、从其他 App 打开）
      command: folio open
    - name: 新建文稿
      command: folio write
    - name: 编辑正文
      command: folio write
    - name: 保存原文件
      command: folio write
    - name: 另存为…
      command: folio write
    - name: 文稿与恢复草稿列表（标题、有本地恢复草稿、提示）
      command: folio session
    - name: 在列表里切换文稿
      human: 窗口导航
    - name: 阅读文稿 / 编辑文稿
      human: 窗口的显示方式
    - name: 显示 Markdown 源码
      human: 窗口的显示方式
    - name: 状态条（原文件已保存 / 修改已存为本地恢复草稿、字数）
      command: folio session
    - name: 插入图片到文档旁的图片目录
      command: folio asset
    - name: 授权图片目录…
      human: 系统“文件”授权面板，只能真人在手机上点；Mac 端不需要这层授权
    - name: 重新载入并保留当前草稿
      missing: 没有命令；这是手机上缓冲区的操作，Mac 端对应的「重新载入」也还没有命令
    - name: 点正文里的链接（跳到锚点、用系统打开网页与邮件链接、其他文稿给提示）
      human: 窗口里的手势
    - name: 提示条与关闭提示
      human: 只在窗口里有意义
    - name: 配置与更新（版本；移动版无可迁移配置）
      missing: 读不到手机上装的版本（folio status 读的是 Mac 包的版本）；共享生命周期模块暂无命令入口
    - name: 检查更新
      missing: 共享生命周期模块暂无命令入口
  account:
    mode: none
    rationale: 本地文稿阅读与编辑入口，没有产品账号、注册或登录；文稿经系统“文件”授权读写，iCloud 云盘等位置由系统 Apple ID 管理，不作为本产品账号。
  accept:
    functionality: /Users/tianli/Dev/.venv/bin/python -B Tests/HostedHarness/run.py --chapter-accept --single-editor
    recovery: bash scripts/test-core.sh
    privacy: bash scripts/test-core.sh
    launch_iphone: SOP_FUNCTIONAL_THIN=1 bash scripts/launch.sh iphone
    launch_ipad: SOP_FUNCTIONAL_THIN=1 bash scripts/launch.sh ipad
    launch_vision: bash scripts/launch.sh vision
  platforms:
    iphone:
      scheme: FolioMobile
      simulator: {device_type: iPhone-17-Pro}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/iphone/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 1500}
      distribution: testflight
    ipad:
      scheme: FolioMobile
      simulator: {device_type: iPad-Pro-13-inch-M5-12GB}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/ipad/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 1500}
      distribution: testflight
    vision:
      scheme: FolioMobile
      simulator: {device_type: Apple-Vision-Pro-4K}
      launch_args: [-folio-demo]
      store_shots: shots/appstore/vision/*.png
      budget: {memory_mb: 150, cpu: 0.5, size_mb: 12, cold_launch_ms: 2000}
      distribution: none
    mac: {component: folio-mac}
    watch:
      not_applicable: 文稿的阅读、光标定位和正文编辑需要足够屏幕与输入；手表没有独立有用的文稿流程。
  measure:
    command: bash scripts/measure-platforms.sh --platform "${SOP_PERF_PLATFORM:-all}"
    platform_env: SOP_PERF_PLATFORM
    outputs: [perf/platforms]
    in_use: true
  budget:
    rationale: 系统 SwiftUI/WebKit 与现有按需加载 Editor；无服务器、轮询或驻留工作线程。数值为预算，尚无移动实测。
  product:
    distribution: public
    source_visibility: public
    source_url: https://github.com/zengtianli/tl-markdown
    rationale: 同一 Folio 产品的移动文稿入口；公开政策继承原产品，移动构建尚未发行。
